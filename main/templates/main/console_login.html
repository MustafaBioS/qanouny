{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qanouny — Counsel sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.hackclub.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&family=Public+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'main/css/console.css' %}">
</head>
<body>

<div class="console-login-page">
<div class="console-login-blobs" aria-hidden="true">
<div style="position:absolute;top:-90px;right:-150px;width:520px;height:450px;background:#1f2c4a;opacity:.1;filter:blur(56px);border-radius:62% 38% 47% 53%/44% 61% 39% 56%;transform:rotate(-12deg)"></div>
<div style="position:absolute;bottom:-140px;left:-150px;width:460px;height:400px;background:#48376D;opacity:.1;filter:blur(56px);border-radius:38% 62% 55% 45%/60% 41% 59% 40%"></div>
</div>

<div class="console-login-card">
<div class="console-login-logo">
<img src="https://cdn.hackclub.com/01a0886b-5b30-7231-ac9e-c3bf0f123bed/qanouny-mark.png" alt="Qanouny">
<span>Qanouny</span>
</div>
<h1 class="console-login-heading">Counsel sign in</h1>
<form method="post" class="console-login-form">
{% csrf_token %}
<input type="text" name="{{ form.username.html_name }}" placeholder="Username" autocomplete="username" required>
<input type="password" name="{{ form.password.html_name }}" placeholder="Password" autocomplete="current-password" required>
{% if form.non_field_errors %}
<p class="console-login-error">{{ form.non_field_errors.0 }}</p>
{% endif %}
<button type="submit">Sign in <span>→</span></button>
</form>
<p class="console-login-hint">Access is issued by the firm. Ask an administrator if you have lost yours.</p>
<a href="{% url 'index' %}" class="console-login-back">Back to home</a>
</div>
</div>

</body>
</html>
